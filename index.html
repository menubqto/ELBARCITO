<body class="bg-ritual-bg text-ritual-text min-h-screen transition-colors duration-700 ease-in-out">

    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // --- 1. CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCbkFb2Dw3Qxc7-9cFzo3Rrd0ZV0nmjDOY",
            authDomain: "el-barcito-f5523.firebaseapp.com",
            projectId: "el-barcito-f5523",
            storageBucket: "el-barcito-f5523.firebasestorage.app",
            messagingSenderId: "144888151909",
            appId: "1:144888151909:web:94f90d9459bc33a9f96b8c"
        };

        const appId = 'ritual-bar-app';
        let app, db, auth, storage;
        let isDemoMode = true;

        // Estado Global Explicito
        window.firebaseStatus = 'initializing'; // 'connected', 'disconnected', 'error'
        window.dbInstance = null; // Exponer para debug

        // --- 2. DATOS SEMILLA (Definidos PRIMERO para asegurar disponibilidad) ---
        const seedData = window.rawSeedData || { categories: [] };

        // Helper: Sort Items by Price (Solo ordena ITEMS, no categorias)
        window.sortCategories = (data) => {
            if (!data || !data.categories) return data;
            const sortedData = { ...data };
            sortedData.categories = sortedData.categories.map(cat => {
                if (!cat.items) return cat;
                const sortedItems = [...cat.items].sort((a, b) => {
                    const priceA = a.variants ? Math.min(...a.variants.map(v => v.price)) : a.price;
                    const priceB = b.variants ? Math.min(...b.variants.map(v => v.price)) : b.price;
                    return priceB - priceA; // Descending Sort (Highest to Lowest)
                });
                // Secondary sort by name (Alphabetical)
                sortedItems.sort((a, b) => {
                    const priceA = a.variants ? Math.min(...a.variants.map(v => v.price)) : a.price;
                    const priceB = b.variants ? Math.min(...b.variants.map(v => v.price)) : b.price;
                    if (priceA === priceB) {
                        return a.name.localeCompare(b.name);
                    }
                    return 0; // Already sorted by price
                });
                return { ...cat, items: sortedItems };
            });
            return sortedData;
        };

        window.seedData = window.sortCategories(seedData);

        // --- DEFINICIÓN DE HELPERS (Antes de initFirebase) ---

        // Helper: Fetch Menu
        window.fetchMenu = async () => {
            // Siempre devolver datos ordenados, incluso en modo demo
            if (isDemoMode || !db) return window.sortCategories(seedData);

            const docRef = doc(db, 'artifacts', appId, 'public', 'menu');

            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();

                    // CORRECCIÓN CRÍTICA:
                    // Si existen datos en la nube, confiamos en ellos completamente.
                    // NO intentamos fusionar con seedData usando IDs porque eso borraba las categorías nuevas.
                    
                    if (cloudData && cloudData.categories && cloudData.categories.length > 0) {
                        // Solo ordenamos los items dentro de las categorías, respetando el orden de las categorías
                        return window.sortCategories(cloudData);
                    } else {
                        // Si el documento existe pero está vacío o corrupto, volvemos a seed
                        return window.sortCategories(seedData);
                    }
                } else {
                    console.log("Creando menú inicial...");
                    await setDoc(docRef, seedData);
                    return window.sortCategories(seedData);
                }
            } catch (err) {
                console.warn("Error obteniendo menú (usando local):", err);
                return window.sortCategories(seedData);
            }
        };

        // Helper: Guardar
        window.saveMenuToDB = async (data) => {
            if (window.firebaseStatus !== 'connected' || !db) {
                console.warn(`Modo Demo/Offline: No se guardan cambios.`);
                alert(`Error: No hay conexión a la base de datos (${window.firebaseStatus}). Revise su conexión.`);
                return false;
            }
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'menu');
                await setDoc(docRef, data);
                console.log("Guardado exitoso");
                return true;
            } catch (err) {
                console.error("Error guardando:", err);
                alert(`Error guardando datos: ${err.message}`);
                return false;
            }
        };


        // Helper interno para actualizar estado
        const updateStatus = (status, error = null) => {
            console.log(`[Firebase] Status: ${status}`, error || '');
            window.firebaseStatus = status;
            if (status === 'connected') {
                isDemoMode = false;
                window.dbInstance = db; // Exponer DB
            } else {
                isDemoMode = true;
            }

            // Notificar a React si existe el listener
            if (window.onFirebaseStatusChange) {
                window.onFirebaseStatusChange(status);
            }
        };

        // --- INICIALIZACIÓN FIREBASE (NO BLOQUEANTE) ---
        const initFirebase = async () => {
            try {
                updateStatus('connecting');
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                storage = getStorage(app);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        updateStatus('connected');
                        console.log("Conectado como:", user.uid);
                    } else {
                        console.log("Usuario desconectado, intentando anónimo...");
                        signInAnonymously(auth).catch(e => {
                            updateStatus('error', e);
                            console.error("Fallo auth anónima:", e);
                        });
                    }
                });
            } catch (e) {
                updateStatus('error', e);
                console.error("Fallo init Firebase:", e);
            }
        };

        // Ejecutar inicialización sin bloquear el resto del script
        initFirebase();

    </script>

    <!-- Componente React Principal -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { icons } = lucide;

        // --- DEFINICIÓN DE TEMAS ---
        const THEMES = [
            { id: 'elbarcito', name: 'El Barcito (Negro/Blanco)', colors: { bg: '#000000', card: '#111111', accent: '#FFFFFF', text: '#FFFFFF', muted: '#888888' } },
            { id: 'ritual', name: 'Ritual Clásico (Marrón/Cobre)', colors: { bg: '#1A1410', card: '#2A211D', accent: '#C86E36', text: '#E5D3B3', muted: '#8C7A6B' } },
            { id: 'obsidian', name: 'Obsidiana Minimalista (Negro/Blanco)', colors: { bg: '#000000', card: '#111111', accent: '#FFFFFF', text: '#EDEDED', muted: '#666666' } },
            { id: 'vino', name: 'Vino Tinto Elegante', colors: { bg: '#2D0A0F', card: '#4A1C23', accent: '#E6B8B8', text: '#FADADD', muted: '#B8858C' } },
            { id: 'oceano', name: 'Océano Profundo (Azul/Gris)', colors: { bg: '#0F172A', card: '#1E293B', accent: '#38BDF8', text: '#F1F5F9', muted: '#94A3B8' } },
            { id: 'bosque', name: 'Bosque Nocturno (Verde/Esmeralda)', colors: { bg: '#052E16', card: '#0F3D24', accent: '#4ADE80', text: '#ECFDF5', muted: '#6EE7B7' } },
            { id: 'navidad', name: 'Feliz Navidad (Verde/Rojo/Dorado)', colors: { bg: '#082f18', card: '#781515', accent: '#FFD700', text: '#FFFFFF', muted: '#d1d5db' } },
            { id: 'semana-santa', name: 'Semana Santa (Nazareno/Púrpura)', colors: { bg: '#1a0b2e', card: '#2e1065', accent: '#fbbf24', text: '#f3e8ff', muted: '#a78bfa' } },
            { id: 'carnaval', name: 'Carnavales Neón (Oscuro/Magenta)', colors: { bg: '#171717', card: '#262626', accent: '#d946ef', text: '#ffffff', muted: '#22d3ee' } },
            { id: 'cardenales', name: 'Cardenales de Lara (Negro/Rojo/Dorado)', colors: { bg: '#000000', card: '#8B0000', accent: '#FFD700', text: '#FFFFFF', muted: '#E5E5E5' } },
            { id: 'divina-pastora', name: 'Divina Pastora (Cream/Dorado/Café)', colors: { bg: '#F2F0E9', card: '#FFFFFF', accent: '#C5A059', text: '#3D312E', muted: '#8C8582' } },
            { id: 'anio-nuevo', name: 'Año Nuevo (Gala/Plata)', colors: { bg: '#000000', card: '#1C1C1C', accent: '#C0C0C0', text: '#FFFFFF', muted: '#9CA3AF' } },
            { id: 'halloween', name: 'Halloween (Naranja/Morado)', colors: { bg: '#0a0a0a', card: '#3b0764', accent: '#ea580c', text: '#f3f4f6', muted: '#9ca3af' } }
        ];

        const AVAILABLE_ICONS = [
            'UtensilsCrossed', 'Fish', 'Martini', 'Wine', 'Flame',
            'Pizza', 'Sandwich', 'Coffee', 'IceCream', 'Cake',
            'Beer', 'Croissant', 'Soup', 'Beef', 'Carrot',
            'Grape', 'ChefHat', 'Cookie', 'Cherry', 'Citrus',
            'GlassWater', 'Anchor', 'Snowflake', 'Milk',
            'CupSoda', 'FlaskConical', 'FlaskRound', 'Beaker', 'TestTube',
            'Popcorn', 'Nut', 'Salad', 'PartyPopper', 'Utensils'
        ];

        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const iconData = icons[name];
            if (!iconData) return icons['Circle'] ? <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10" /></svg> : null;
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {iconData.map((child, index) => React.createElement(child[0], { ...child[1], key: index }))}
                </svg>
            );
        };

        const SplashScreen = ({ onComplete }) => {
            const canvasRef = useRef(null);
            const [params, setParams] = useState({ opacity: 1 });
            const [useFallback, setUseFallback] = useState(false);

            useEffect(() => {
                // Si estamos en modo fallback, esperar y terminar
                if (useFallback) {
                    const t1 = setTimeout(() => setParams({ opacity: 0 }), 2500);
                    const t2 = setTimeout(onComplete, 3200);
                    return () => { clearTimeout(t1); clearTimeout(t2); };
                }

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                let width, height;

                const initAnimation = async () => {
                    try {
                        const data = await window.LogoData.extractPoints('./logo_new.png');
                        width = data.width;
                        height = data.height;
                        canvas.width = width;
                        canvas.height = height;

                        // Estado inicial de partículas (dispersas)
                        particles = data.particles.map(p => ({
                            ...p,
                            currX: Math.random() * window.innerWidth - window.innerWidth / 2, // Muy dispersas en X
                            currY: Math.random() * window.innerHeight - window.innerHeight / 2, // Muy dispersas en Y
                            vx: 0,
                            vy: 0
                        }));

                        animate();

                        // Iniciar secuencia de salida después de un tiempo
                        setTimeout(() => {
                            setParams({ opacity: 0 });
                            setTimeout(onComplete, 800);
                        }, 3500); // Duración total de la intro

                    } catch (e) {
                        console.warn("Fallo carga de partículas (posible CORS por file://). Usando fallback CSS.");
                        setUseFallback(true);
                    }
                };

                const animate = () => {
                    if (!ctx) return;
                    ctx.clearRect(0, 0, width, height);

                    let allSettled = true; // Flag para saber si ya se formó

                    particles.forEach(p => {
                        // Dinámica simple de atracción al punto objetivo (x, y)
                        const dx = p.x - p.currX;
                        const dy = p.y - p.currY;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        // Velocidad proporcional a la distancia (easing)
                        p.vx = (p.vx + dx * 0.05) * 0.85; // Spring force + friction
                        p.vy = (p.vy + dy * 0.05) * 0.85;

                        p.currX += p.vx;
                        p.currY += p.vy;

                        // Dibujar
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.currX, p.currY, 1, 1); // 1x1 pixel particles

                        if (dist > 0.5) allSettled = false;
                    });

                    // Si ya se formó casi todo, detener (opcional, pero mejor dejar loop para estabilidad)
                    animationFrameId = requestAnimationFrame(animate);
                };

                // Intentar iniciar animación de partículas
                initAnimation();

                return () => {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                };
            }, [onComplete, useFallback]);

            return (
                <div
                    className="fixed inset-0 bg-black z-[100] flex items-center justify-center transition-opacity duration-700 ease-out"
                    style={{ opacity: params.opacity }}
                >
                    {useFallback ? (
                        <div className="animate-fadeIn transition-transform duration-1000 hover:scale-105">
                            <img
                                src="./logo_new.png"
                                className="w-64 md:w-80 h-auto object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] animate-pulse-slow"
                                alt="El Barcito"
                            />
                        </div>
                    ) : (
                        <canvas ref={canvasRef} className="scale-125 md:scale-150" />
                    )}
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [menuData, setMenuData] = useState(window.seedData); // Init inmediato para evitar parpadeo post-splash
            const [loading, setLoading] = useState(true);
            const [activeCategory, setActiveCategory] = useState(null);

            // Estados Admin
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState("");
            const [showThemeSelector, setShowThemeSelector] = useState(false);
            const [editingIconCategory, setEditingIconCategory] = useState(null);

            // Estado de Conexión
            const [dbStatus, setDbStatus] = useState(window.firebaseStatus || 'initializing');

            // Estado de Guardado
            const [isSaving, setIsSaving] = useState(false);

            // Estados para Imagenes
            const [showCropModal, setShowCropModal] = useState(false);
            const [cropImageSrc, setCropImageSrc] = useState(null);
            const [editingItemCoords, setEditingItemCoords] = useState(null);
            const cropperRef = useRef(null);
            const imageElementRef = useRef(null);

            // Hook de Carga Inicial con Timeout de Seguridad
            useEffect(() => {
                let isMounted = true;

                const loadData = async () => {
                    // Promesa de timeout: si Firebase tarda más de 4s, resolvemos con 'timeout'
                    const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve('timeout'), 4000));

                    try {
                        let data;
                        if (window.fetchMenu) {
                            // Carrera entre la carga real y el timeout
                            const result = await Promise.race([window.fetchMenu(), timeoutPromise]);

                            if (result === 'timeout') {
                                console.warn("Firebase tardó mucho, usando datos locales.");
                                data = window.seedData;
                            } else {
                                data = result;
                            }
                        } else {
                            data = window.seedData;
                        }

                        if (isMounted) {
                            // Aseguramos que siempre haya datos
                            setMenuData(data || window.seedData);
                            setLoading(false);
                        }
                    } catch (error) {
                        console.error("Error cargando datos:", error);
                        if (isMounted) {
                            setMenuData(window.seedData);
                            setLoading(false);
                        }
                    }
                };

                // Suscribirse a cambios de estado de Firebase
                window.onFirebaseStatusChange = (status) => {
                    if (isMounted) setDbStatus(status);
                };

                // Carga inicial
                loadData();

                return () => { isMounted = false; };
            }, []);

            // Efecto: Re-cargar datos cuando nos conectamos
            useEffect(() => {
                if (dbStatus === 'connected') {
                    console.log("Detectada conexión a DB, refrescando datos...");
                    // Re-utilizamos la lógica de fetchMenu que ahora usará la DB
                    window.fetchMenu().then(data => {
                        setMenuData(data);
                        setLoading(false);
                    });
                }
            }, [dbStatus]);

            useEffect(() => {
                if (menuData && menuData.theme) {
                    const theme = THEMES.find(t => t.id === menuData.theme) || THEMES[0];
                    const root = document.documentElement;
                    root.style.setProperty('--color-bg', theme.colors.bg);
                    root.style.setProperty('--color-card', theme.colors.card);
                    root.style.setProperty('--color-accent', theme.colors.accent);
                    root.style.setProperty('--color-text', theme.colors.text);
                    root.style.setProperty('--color-muted', theme.colors.muted);
                }
            }, [menuData]);

            // --- Lógica de Recorte ---
            useEffect(() => {
                if (showCropModal && cropImageSrc && imageElementRef.current) {
                    if (cropperRef.current) cropperRef.current.destroy();
                    cropperRef.current = new Cropper(imageElementRef.current, {
                        aspectRatio: 1,
                        viewMode: 1,
                        background: false,
                        autoCropArea: 1,
                        responsive: true,
                    });
                }
                return () => { if (cropperRef.current) cropperRef.current.destroy(); };
            }, [showCropModal, cropImageSrc]);

            const handleFileSelect = (e, catId, index) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        setCropImageSrc(reader.result);
                        setEditingItemCoords({ catId, index });
                        setShowCropModal(true);
                        e.target.value = '';
                    };
                    reader.readAsDataURL(file);
                }
            };

            const performCrop = async () => {
                if (!cropperRef.current || !editingItemCoords) return;

                setIsSaving(true); // Mostrar feedback visual

                try {
                    const canvas = cropperRef.current.getCroppedCanvas({
                        width: 350, height: 350, // Resolución optimizada para móvil
                        imageSmoothingEnabled: true, imageSmoothingQuality: 'high',
                    });

                    // Obtener URL Base64 directa (comprimida)
                    // Calidad 0.7 reduce significativamente el tamaño sin perder mucha calidad visual
                    const imageUrl = canvas.toDataURL('image/jpeg', 0.7);

                    if (!imageUrl) {
                        setIsSaving(false);
                        return;
                    }

                    const { catId, index } = editingItemCoords;
                    updateItem(catId, index, 'image', imageUrl);

                    // Cleanup
                    setShowCropModal(false);
                    setCropImageSrc(null);
                    setEditingItemCoords(null);
                    setIsSaving(false);

                    // Destroy canvas manually if needed (browsers handle this but good practice)
                    canvas.remove();

                } catch (error) {
                    console.error("Error en recorte:", error);
                    setIsSaving(false);
                }
            };

            // --- MANEJADORES ---
            const toggleCategory = (id) => setActiveCategory(activeCategory === id ? null : id);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === "admin123") {
                    setIsAdmin(true);
                    setShowLogin(false);
                    setPassword("");
                } else {
                    alert("Contraseña incorrecta");
                }
            };

            const saveChanges = async (newData) => {
                setMenuData(newData);
                setIsSaving(true);
                if (window.saveMenuToDB) {
                    await window.saveMenuToDB(newData);
                }
                setTimeout(() => setIsSaving(false), 800);
            };

            const resetDatabase = async () => {
                const confirmMsg = "⚠️ ¿PELIGRO: Estás seguro de REINICIAR toda la base de datos?\n\nEsto borrará los datos actuales de la nube y los sobrescribirá con los datos locales originales del archivo menu_data.js.\n\nEsta acción NO se puede deshacer.";
                if (!confirm(confirmMsg)) return;

                setIsSaving(true);
                // Usamos window.sortCategories(window.rawSeedData) para asegurar que subimos la versión limpia del archivo
                const cleanData = window.sortCategories(window.rawSeedData || window.seedData);

                if (window.saveMenuToDB) {
                    const success = await window.saveMenuToDB(cleanData);
                    if (success) {
                        setMenuData(cleanData);
                        alert("✅ Base de datos reiniciada correctamente con los datos locales.");
                    }
                } else {
                    alert("Error: Función de guardado no disponible.");
                }
                setIsSaving(false);
            };

            // HELPER: Deep Copy para evitar mutaciones de estado
            const getCleanData = () => structuredClone(menuData);

            const updateItem = (catId, index, field, value) => {
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                if (field === 'price') value = Number(value);
                newData.categories[catIndex].items[index][field] = value;
                saveChanges(newData);
            };

            const updateVariant = (catId, itemIndex, variantIndex, field, value) => {
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                if (field === 'price') value = Number(value);
                newData.categories[catIndex].items[itemIndex].variants[variantIndex][field] = value;
                saveChanges(newData);
            };

            const addVariant = (catId, itemIndex) => {
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                const item = newData.categories[catIndex].items[itemIndex];

                if (!item.variants) {
                    item.variants = [
                        { name: "Estándar", price: item.price || 0 },
                        { name: "Nuevo", price: 0 }
                    ];
                    item.price = 0;
                } else {
                    item.variants.push({ name: "Nuevo", price: 0 });
                }
                saveChanges(newData);
            };

            const removeVariant = (catId, itemIndex, variantIndex) => {
                if (!confirm("¿Eliminar este sub-producto?")) return;
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                const item = newData.categories[catIndex].items[itemIndex];

                item.variants.splice(variantIndex, 1);

                if (item.variants.length === 0) {
                    delete item.variants;
                    item.price = 0;
                }
                saveChanges(newData);
            };

            const removeItemImage = (catId, index) => {
                if (!confirm("¿Eliminar imagen del plato?")) return;
                updateItem(catId, index, 'image', null);
            };

            const deleteItem = (catId, index) => {
                if (!confirm("¿Estás seguro de borrar este plato?")) return;
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                newData.categories[catIndex].items.splice(index, 1);
                saveChanges(newData);
            };

            const addItem = (catId) => {
                const name = prompt("Nombre del nuevo plato:");
                if (!name) return;
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                // Ensure items array exists
                if (!newData.categories[catIndex].items) newData.categories[catIndex].items = [];

                newData.categories[catIndex].items.push({
                    name,
                    desc: "Descripción nueva",
                    price: 0,
                    image: null,
                    variants: null
                });
                saveChanges(newData);
            };

            const toggleCatVisibility = (catId) => {
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                newData.categories[catIndex].visible = !newData.categories[catIndex].visible;
                saveChanges(newData);
            };

            const updateCategoryName = (catId, newName) => {
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === catId);
                newData.categories[catIndex].name = newName;
                saveChanges(newData);
            };

            const updateCategoryIcon = (iconName) => {
                if (!editingIconCategory) return;
                const newData = getCleanData();
                const catIndex = newData.categories.findIndex(c => c.id === editingIconCategory);
                newData.categories[catIndex].icon = iconName;
                saveChanges(newData);
                setEditingIconCategory(null);
            };

            const addCategory = () => {
                const newData = getCleanData();
                const newId = `cat-${Date.now()}`;
                const newCat = {
                    id: newId,
                    name: 'NUEVA CATEGORÍA',
                    icon: 'Utensils',
                    visible: true, // Default visible to avoid consistency confusion
                    items: []
                };
                newData.categories.push(newCat);
                saveChanges(newData);
            };

            const deleteCategory = (catId) => {
                if (!confirm("¿Estás seguro de eliminar toda esta categoría y sus platos?")) return;
                const newData = getCleanData();
                newData.categories = newData.categories.filter(c => c.id !== catId);
                saveChanges(newData);
            };

            // NUEVA FUNCIÓN: Mover Categoría
            const moveCategory = (index, direction, e) => {
                e.stopPropagation(); // Evitar colapsar/expandir al hacer click
                const newData = getCleanData();
                
                if (direction === -1 && index > 0) {
                    // Mover Arriba
                    const temp = newData.categories[index];
                    newData.categories[index] = newData.categories[index - 1];
                    newData.categories[index - 1] = temp;
                } else if (direction === 1 && index < newData.categories.length - 1) {
                    // Mover Abajo
                    const temp = newData.categories[index];
                    newData.categories[index] = newData.categories[index + 1];
                    newData.categories[index + 1] = temp;
                } else {
                    return; // Movimiento no válido
                }
                
                saveChanges(newData);
            };

            const changeTheme = (themeId) => {
                const newData = getCleanData();
                newData.theme = themeId;
                saveChanges(newData);
            };

            const handleSplashComplete = useCallback(() => {
                setShowSplash(false);
            }, []);

            if (showSplash) {
                return <SplashScreen onComplete={handleSplashComplete} />;
            }

            if (loading) return (
                <div className="flex items-center justify-center h-screen bg-ritual-bg text-ritual-accent">
                    <div className="flex flex-col items-center gap-4">
                        <LucideIcon name="Loader2" className="animate-spin" size={48} />
                        <span className="uppercase tracking-widest text-xs">Cargando Experiencia...</span>
                    </div>
                </div>
            );

            if (!menuData) return <div className="text-white p-10 text-center">No se pudieron cargar los datos.</div>;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-ritual-bg shadow-2xl relative pb-24 border-x border-ritual-card transition-colors duration-700">

                    {/* HEADER */}
                    <header className="p-6 text-center border-b border-ritual-accent/20 bg-ritual-bg transition-colors duration-700">
                        <div className="flex justify-center">
                            <div className="transition-transform duration-700 hover:scale-105 w-full flex justify-center">
                                <img
                                    src="./logo_new.png"
                                    alt="El Barcito Logo"
                                    className="h-36 w-auto max-w-full object-contain logo-glow"
                                    onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/300x150?text=EL+BARCITO' }}
                                />
                            </div>
                        </div>
                    </header>

                    {/* CONTENIDO DEL MENÚ */}
                    <main className="p-4 space-y-4 mt-2">
                        {menuData.categories.map((cat, catIndex) => (
                            (!cat.visible && !isAdmin) ? null : (
                                <div key={cat.id} className={`rounded-lg overflow-hidden transition-all duration-300 ${activeCategory === cat.id ? 'bg-ritual-card shadow-lg ring-1 ring-ritual-accent/30 mb-4 scale-[1.02]' : 'bg-ritual-card/40 hover:bg-ritual-card/60'}`}>

                                    {/* CABECERA DE CATEGORÍA */}
                                    <div
                                        className="p-5 flex items-center justify-between cursor-pointer select-none"
                                        onClick={() => toggleCategory(cat.id)}
                                    >
                                        <div className="flex items-center gap-4 flex-1">
                                            <div
                                                onClick={(e) => {
                                                    if (isAdmin) {
                                                        e.stopPropagation();
                                                        setEditingIconCategory(cat.id);
                                                    }
                                                }}
                                                className={`p-2 rounded-md transition-colors relative group/icon ${activeCategory === cat.id ? 'bg-ritual-accent/20 text-ritual-accent' : 'bg-black/20 text-ritual-muted'} ${isAdmin ? 'hover:bg-ritual-accent/40 cursor-pointer' : ''} `}
                                            >
                                                <LucideIcon name={cat.icon} size={24} />
                                                {isAdmin && <div className="absolute -top-1 -right-1 bg-ritual-accent text-white rounded-full p-0.5 transform scale-0 group-hover/icon:scale-100 transition-transform"><LucideIcon name="Pencil" size={10} /></div>}
                                            </div>

                                            {isAdmin ? (
                                                <div className="flex-1" onClick={(e) => e.stopPropagation()}>
                                                    <input
                                                        value={cat.name}
                                                        onChange={(e) => updateCategoryName(cat.id, e.target.value)}
                                                        className="bg-transparent text-lg font-semibold tracking-wide uppercase text-ritual-text w-full outline-none border-b border-transparent focus:border-ritual-accent/50"
                                                    />
                                                </div>
                                            ) : (
                                                <h2 className={`text-lg font-semibold tracking-wide uppercase whitespace-normal leading-tight ${activeCategory === cat.id ? 'text-ritual-text' : 'text-ritual-text/80'} `}>{cat.name}</h2>
                                            )}

                                            {isAdmin && !cat.visible && <span className="text-[10px] uppercase font-bold tracking-wider bg-red-900/50 text-red-200 px-2 py-0.5 rounded border border-red-800">Oculto</span>}
                                        </div>

                                        <div className="flex items-center gap-3">
                                            {isAdmin && (
                                                <div className="flex items-center gap-1 bg-black/20 rounded-full p-1 mr-2">
                                                    
                                                    {/* Botones de Reordenamiento */}
                                                    <button 
                                                        onClick={(e) => moveCategory(catIndex, -1, e)} 
                                                        disabled={catIndex === 0}
                                                        className={`p-1.5 rounded-full transition-colors ${catIndex === 0 ? 'text-ritual-muted/20 cursor-default' : 'text-ritual-muted hover:text-white hover:bg-white/10'}`}
                                                        title="Mover arriba"
                                                    >
                                                        <LucideIcon name="ChevronUp" size={14} />
                                                    </button>
                                                    <button 
                                                        onClick={(e) => moveCategory(catIndex, 1, e)} 
                                                        disabled={catIndex === menuData.categories.length - 1}
                                                        className={`p-1.5 rounded-full transition-colors ${catIndex === menuData.categories.length - 1 ? 'text-ritual-muted/20 cursor-default' : 'text-ritual-muted hover:text-white hover:bg-white/10'}`}
                                                        title="Mover abajo"
                                                    >
                                                        <LucideIcon name="ChevronDown" size={14} />
                                                    </button>

                                                    <div className="w-px h-4 bg-white/10 mx-1"></div>

                                                    <button onClick={(e) => { e.stopPropagation(); toggleCatVisibility(cat.id) }} className="p-1.5 text-ritual-muted hover:text-ritual-text hover:bg-white/10 rounded-full transition-colors" title={cat.visible ? "Ocultar al público" : "Mostrar al público"}>
                                                        <LucideIcon name={cat.visible ? "Eye" : "EyeOff"} size={16} />
                                                    </button>
                                                    <button onClick={(e) => { e.stopPropagation(); deleteCategory(cat.id) }} className="p-1.5 text-red-400/50 hover:text-red-400 hover:bg-red-900/20 rounded-full transition-colors" title="Eliminar Categoría">
                                                        <LucideIcon name="Trash2" size={16} />
                                                    </button>
                                                </div>
                                            )}
                                            <LucideIcon
                                                name="ChevronDown"
                                                className={`text-ritual-muted transition-transform duration-300 ${activeCategory === cat.id ? 'rotate-180 text-ritual-accent' : ''} `}
                                                size={20}
                                            />
                                        </div>
                                    </div>

                                    {/* LISTA DE PLATOS */}
                                    {activeCategory === cat.id && (
                                        <div className="border-t border-ritual-accent/10 animate-fadeIn bg-black/10">
                                            <div className="p-4 space-y-4">
                                                {cat.items.map((item, index) => (
                                                    <div key={index} className="flex gap-4 group relative p-2 rounded-lg hover:bg-white/5 transition-colors">

                                                        {item.image && (
                                                            <div className="w-32 h-32 shrink-0 rounded-lg overflow-hidden border border-ritual-muted/20 shadow-sm bg-black/20 self-center">
                                                                <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                                                            </div>
                                                        )}

                                                        <div className="flex-1 flex flex-row items-center gap-3 py-1">

                                                            {/* IZQUIERDA: Info del Producto */}
                                                            <div className="flex-1 min-w-0 flex flex-col justify-center">
                                                                <div className="flex flex-col">
                                                                    {isAdmin ? (
                                                                        <input
                                                                            className="bg-transparent border-b border-ritual-muted/50 w-full text-ritual-text font-medium focus:border-ritual-accent outline-none py-1 transition-colors"
                                                                            value={item.name}
                                                                            onChange={(e) => updateItem(cat.id, index, 'name', e.target.value)}
                                                                        />
                                                                    ) : (
                                                                        <h3 className="font-medium text-base text-ritual-text tracking-wide leading-tight">{item.name}</h3>
                                                                    )}

                                                                    {isAdmin ? (
                                                                        <textarea
                                                                            className="bg-transparent border-b border-ritual-muted/30 w-full text-sm text-ritual-muted mt-1 outline-none resize-none h-12 transition-colors"
                                                                            value={item.desc}
                                                                            onChange={(e) => updateItem(cat.id, index, 'desc', e.target.value)}
                                                                        />
                                                                    ) : (
                                                                        item.desc && <p className="text-xs text-ritual-muted mt-0.5 leading-relaxed font-light opacity-80">{item.desc}</p>
                                                                    )}
                                                                </div>

                                                                {/* Admin Actions */}
                                                                {isAdmin && (
                                                                    <div className="flex items-center gap-2 mt-2">
                                                                        <label className="cursor-pointer text-ritual-muted hover:text-ritual-accent transition-colors p-1" title="Subir Foto">
                                                                            <input
                                                                                type="file"
                                                                                accept="image/*"
                                                                                className="hidden"
                                                                                onChange={(e) => handleFileSelect(e, cat.id, index)}
                                                                            />
                                                                            <LucideIcon name="Camera" size={14} />
                                                                        </label>
                                                                        {item.image && (
                                                                            <button onClick={() => removeItemImage(cat.id, index)} className="text-red-400/60 hover:text-red-400 p-1" title="Quitar imagen">
                                                                                <LucideIcon name="ImageMinus" size={14} />
                                                                            </button>
                                                                        )}
                                                                        <button onClick={() => deleteItem(cat.id, index)} className="text-red-500/50 hover:text-red-400 p-1" title="Eliminar plato">
                                                                            <LucideIcon name="Trash2" size={14} />
                                                                        </button>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            {/* DERECHA: Precios (50% width, Stacked) */}
                                                            <div className="w-1/2 flex flex-col gap-1 justify-center shrink-0">
                                                                {item.variants ? (
                                                                    item.variants.map((v, vIndex) => (
                                                                        <div key={vIndex} className="flex justify-between items-center w-full bg-white/5 px-2 py-1 rounded text-xs gap-2 mb-1">
                                                                            {isAdmin ? (
                                                                                <>
                                                                                    <input
                                                                                        value={v.name}
                                                                                        onChange={(e) => updateVariant(cat.id, index, vIndex, 'name', e.target.value)}
                                                                                        className="bg-transparent text-ritual-muted text-[10px] uppercase tracking-wider w-full outline-none border-b border-white/10 focus:border-ritual-accent placeholder-white/20"
                                                                                        placeholder="NOMBRE"
                                                                                    />
                                                                                    <div className="flex items-center gap-1">
                                                                                        <span className="text-ritual-accent">$</span>
                                                                                        <input
                                                                                            type="number"
                                                                                            value={v.price}
                                                                                            onChange={(e) => updateVariant(cat.id, index, vIndex, 'price', e.target.value)}
                                                                                            className="bg-transparent font-bold text-ritual-accent w-12 text-right outline-none border-b border-white/10 focus:border-ritual-accent"
                                                                                        />
                                                                                        <button onClick={() => removeVariant(cat.id, index, vIndex)} className="text-red-400 hover:text-red-300 ml-1">
                                                                                            <LucideIcon name="Trash2" size={12} />
                                                                                        </button>
                                                                                    </div>
                                                                                </>
                                                                            ) : (
                                                                                <>
                                                                                    <span className="text-ritual-muted truncate text-[10px] uppercase tracking-wider">{v.name}</span>
                                                                                    <span className="font-bold text-ritual-accent whitespace-nowrap ml-2">${v.price}</span>
                                                                                </>
                                                                            )}
                                                                        </div>
                                                                    ))
                                                                ) : (
                                                                    <div className="flex flex-col items-end w-full">
                                                                        {isAdmin ? (
                                                                            <>
                                                                                <div className="flex items-center gap-1 bg-white/5 px-3 py-1 rounded w-full justify-end">
                                                                                    <span className="text-ritual-accent text-xs">$</span>
                                                                                    <input
                                                                                        type="number"
                                                                                        className="bg-transparent w-full text-right font-bold text-ritual-accent outline-none"
                                                                                        value={item.price}
                                                                                        onChange={(e) => updateItem(cat.id, index, 'price', e.target.value)}
                                                                                    />
                                                                                </div>
                                                                                <button
                                                                                    onClick={() => addVariant(cat.id, index)}
                                                                                    className="text-[9px] text-ritual-muted hover:text-ritual-accent mt-1 transition-colors uppercase tracking-wider"
                                                                                >
                                                                                    + Crear Variantes
                                                                                </button>
                                                                            </>
                                                                        ) : (
                                                                            item.price > 0 && (
                                                                                <div className="w-full bg-white/5 px-3 py-1.5 rounded flex justify-between items-center">
                                                                                    <span className="text-[10px] text-ritual-muted uppercase tracking-wider">Precio</span>
                                                                                    <span className="text-base font-bold text-ritual-accent">${item.price}</span>
                                                                                </div>
                                                                            )
                                                                        )}
                                                                    </div>
                                                                )}
                                                                {/* Botón Agregar Variante si ya existen variantes */}
                                                                {isAdmin && item.variants && (
                                                                    <button
                                                                        onClick={() => addVariant(cat.id, index)}
                                                                        className="w-full text-[10px] text-center bg-white/5 hover:bg-ritual-accent/20 text-ritual-accent py-1 rounded transition-colors mt-1 uppercase tracking-wider"
                                                                    >
                                                                        + Agregar Sub-Producto
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}

                                                {isAdmin && (
                                                    <button
                                                        onClick={() => addItem(cat.id)}
                                                        className="w-full py-3 border border-dashed border-ritual-muted/50 text-ritual-muted rounded hover:border-ritual-accent hover:text-ritual-accent hover:bg-ritual-accent/5 transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider mt-4"
                                                    >
                                                        <LucideIcon name="Plus" size={16} /> Agregar Plato
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )))}

                        {isAdmin && (
                            <button
                                onClick={addCategory}
                                className="w-full py-4 bg-ritual-card border border-ritual-accent/30 text-ritual-accent rounded-lg hover:bg-ritual-accent hover:text-white transition-all flex items-center justify-center gap-3 shadow-lg uppercase tracking-widest font-bold mt-6"
                            >
                                <LucideIcon name="FolderPlus" size={20} /> Nueva Categoría
                            </button>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="mt-12 py-8 text-center text-ritual-muted text-[10px] uppercase tracking-widest relative opacity-80">
                        <div className="flex justify-center mb-4">
                            <a href="https://instagram.com/elbarcito_ve" target="_blank" rel="noopener noreferrer" className="text-ritual-accent hover:text-white transition-all duration-300 hover:scale-110">
                                <LucideIcon name="Instagram" size={24} />
                            </a>
                        </div>
                        <p className="mt-2 opacity-50">Precios sujetos a cambio sin previo aviso</p>
                        <button
                            onClick={() => setShowLogin(true)}
                            className="absolute bottom-4 right-4 p-2 text-ritual-muted/30 hover:text-ritual-muted transition-colors cursor-pointer z-10"
                            title="Acceso Admin"
                        >
                            <LucideIcon name="Settings" size={14} />
                        </button>
                    </footer>

                    {/* MODAL CROP */}
                    {
                        showCropModal && (
                            <div className="fixed inset-0 bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center z-[60] p-4 animate-fadeIn">
                                <div className="bg-ritual-card w-full max-w-lg rounded-xl overflow-hidden shadow-2xl border border-ritual-accent/30 flex flex-col max-h-[90vh]">
                                    <div className="p-4 border-b border-ritual-muted/20 flex justify-between items-center bg-ritual-bg/50">
                                        <h3 className="text-ritual-text font-bold uppercase tracking-widest flex items-center gap-2 text-sm">
                                            <LucideIcon name="Crop" size={16} /> Ajustar Imagen
                                        </h3>
                                        <button onClick={() => { setShowCropModal(false); setCropImageSrc(null); }} className="text-ritual-muted hover:text-white"><LucideIcon name="X" size={20} /></button>
                                    </div>
                                    <div className="flex-1 bg-black relative overflow-hidden flex items-center justify-center p-4">
                                        <div className="max-h-[50vh] w-full">
                                            <img ref={imageElementRef} src={cropImageSrc} alt="Crop preview" className="max-w-full block" />
                                        </div>
                                    </div>
                                    <div className="p-4 bg-ritual-bg/50 border-t border-ritual-muted/20 flex justify-end gap-3">
                                        <button onClick={() => { setShowCropModal(false); setCropImageSrc(null); }} className="px-4 py-2 text-xs font-bold uppercase tracking-wider text-ritual-muted hover:text-white transition-colors">Cancelar</button>
                                        <button onClick={performCrop} className="px-6 py-2 bg-ritual-accent text-white text-xs font-bold uppercase tracking-wider rounded shadow-lg hover:bg-ritual-accent/80 transition-colors flex items-center gap-2">
                                            <LucideIcon name="Check" size={14} /> Guardar Foto
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )
                    }

                    {/* MODAL LOGIN */}
                    {
                        showLogin && !isAdmin && (
                            <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fadeIn">
                                <div className="bg-ritual-card p-8 rounded-xl w-full max-w-xs border border-ritual-accent/50 shadow-[0_0_30px_rgba(0,0,0,0.5)]">
                                    <div className="text-center mb-6">
                                        <LucideIcon name="Lock" className="mx-auto text-ritual-accent mb-2" size={24} />
                                        <h3 className="text-ritual-text text-xl font-light uppercase tracking-widest">Acceso Admin</h3>
                                    </div>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <input type="password" placeholder="Contraseña" className="w-full bg-ritual-bg border border-ritual-muted/50 p-3 rounded text-ritual-text focus:border-ritual-accent outline-none transition-colors text-center tracking-widest placeholder-ritual-muted/50" value={password} onChange={(e) => setPassword(e.target.value)} autoFocus />
                                        <div className="flex gap-3 pt-2">
                                            <button type="button" onClick={() => setShowLogin(false)} className="flex-1 py-2 bg-transparent border border-ritual-muted text-ritual-muted rounded hover:bg-white/5 transition-colors uppercase text-xs tracking-wider">Cancelar</button>
                                            <button type="submit" className="flex-1 py-2 bg-ritual-accent text-white font-bold rounded shadow-lg shadow-ritual-accent/20 hover:bg-ritual-accent/90 transition-colors uppercase text-xs tracking-wider">Entrar</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )
                    }

                    {/* SELECTOR DE TEMAS */}
                    {
                        showThemeSelector && isAdmin && (
                            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-end sm:items-center justify-center z-50 animate-fadeIn">
                                <div className="bg-ritual-card w-full sm:max-w-md max-h-[80vh] overflow-y-auto rounded-t-2xl sm:rounded-xl border-t sm:border border-ritual-accent/30 shadow-2xl">
                                    <div className="sticky top-0 bg-ritual-card/95 backdrop-blur p-4 border-b border-ritual-muted/20 flex justify-between items-center z-10">
                                        <h3 className="text-ritual-text font-bold uppercase tracking-widest flex items-center gap-2">
                                            <LucideIcon name="Palette" size={18} /> Elegir Tema
                                        </h3>
                                        <button onClick={() => setShowThemeSelector(false)} className="text-ritual-muted hover:text-white"><LucideIcon name="X" size={20} /></button>
                                    </div>
                                    <div className="p-4 grid grid-cols-1 gap-3">
                                        {THEMES.map(theme => (
                                            <button key={theme.id} onClick={() => changeTheme(theme.id)} className={`flex items-center gap-4 p-3 rounded-lg border transition-all group ${menuData.theme === theme.id ? 'border-ritual-accent bg-ritual-accent/10' : 'border-transparent hover:bg-white/5'} `}>
                                                <div className="flex gap-1 shrink-0">
                                                    <div className="w-6 h-6 rounded-full border border-white/20 shadow-sm" style={{ backgroundColor: theme.colors.bg }}></div>
                                                    <div className="w-6 h-6 rounded-full border border-white/20 shadow-sm" style={{ backgroundColor: theme.colors.card }}></div>
                                                    <div className="w-6 h-6 rounded-full border border-white/20 shadow-sm" style={{ backgroundColor: theme.colors.accent }}></div>
                                                </div>
                                                <span className="text-ritual-text font-medium text-sm text-left flex-1 group-hover:text-ritual-accent transition-colors">{theme.name}</span>
                                                {menuData.theme === theme.id && <LucideIcon name="Check" size={16} className="text-ritual-accent" />}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )
                    }

                    {/* SELECTOR DE ICONOS */}
                    {
                        editingIconCategory && isAdmin && (
                            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-end sm:items-center justify-center z-50 animate-fadeIn">
                                <div className="bg-ritual-card w-full sm:max-w-md rounded-t-2xl sm:rounded-xl border-t sm:border border-ritual-accent/30 shadow-2xl max-h-[80vh] flex flex-col">
                                    <div className="p-4 border-b border-ritual-muted/20 flex justify-between items-center">
                                        <h3 className="text-ritual-text font-bold uppercase tracking-widest flex items-center gap-2">
                                            <LucideIcon name="LayoutGrid" size={18} /> Elegir Icono
                                        </h3>
                                        <button onClick={() => setEditingIconCategory(null)} className="text-ritual-muted hover:text-white"><LucideIcon name="X" size={20} /></button>
                                    </div>
                                    <div className="p-6 grid grid-cols-5 gap-4 overflow-y-auto">
                                        {AVAILABLE_ICONS.map(iconName => (
                                            <button key={iconName} onClick={() => updateCategoryIcon(iconName)} className="aspect-square flex flex-col items-center justify-center gap-1 rounded-lg border border-ritual-muted/20 hover:bg-ritual-accent/20 hover:border-ritual-accent hover:text-ritual-accent text-ritual-muted transition-all">
                                                <LucideIcon name={iconName} size={24} />
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )
                    }

                    {/* BARRA FLOTANTE ADMIN */}
                    {
                        isAdmin && (
                            <div className="fixed bottom-0 left-0 right-0 bg-ritual-accent/95 backdrop-blur text-white p-3 text-center text-sm font-bold z-40 flex justify-between items-center px-6 shadow-[0_-5px_20px_rgba(0,0,0,0.5)] animate-fadeIn">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setShowThemeSelector(true)} className="bg-black/20 p-2 rounded-full hover:bg-black/40 transition-colors flex items-center gap-2 px-3" title="Cambiar Tema Visual">
                                        <LucideIcon name="Palette" size={16} />
                                        <span className="text-[10px] uppercase tracking-wider">Temas</span>
                                    </button>

                                    <button onClick={resetDatabase} className="bg-red-500/20 p-2 rounded-full hover:bg-red-500/40 transition-colors flex items-center gap-2 px-3 border border-red-500/30 text-red-100" title="Reiniciar Base de Datos">
                                        <LucideIcon name="DatabaseBackup" size={16} />
                                        <span className="text-[10px] uppercase tracking-wider hidden sm:inline">Reset DB</span>
                                    </button>



                                    {/* Status Pill */}
                                    <div className={`px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider flex items-center gap-2 border transition-colors ${dbStatus === 'connected' ? 'bg-green-500/20 text-green-100 border-green-500/50' : 'bg-red-500/20 text-red-100 border-red-500/50'} `}>
                                        <div className={`w-2 h-2 rounded-full ${dbStatus === 'connected' ? 'bg-green-400 shadow-[0_0_5px_rgba(74,222,128,0.8)]' : 'bg-red-400 animate-pulse'}`}></div>
                                        {dbStatus === 'connected' ? 'En Línea' : 'Offline'}
                                    </div>
                                </div>

                                <div className="flex items-center gap-4">
                                    {isSaving && (
                                        <div className="flex items-center gap-2 text-white/90 animate-pulse">
                                            <LucideIcon name="RefreshCw" className="animate-spin" size={14} />
                                            <span className="text-[10px] uppercase font-bold tracking-widest hidden sm:inline">Guardando...</span>
                                        </div>
                                    )}
                                    <button onClick={() => setIsAdmin(false)} className="bg-black/20 px-4 py-1.5 rounded-full hover:bg-black/40 transition-colors uppercase text-[10px] tracking-widest font-bold">Salir</button>
                                </div>
                            </div>
                        )
                    }
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
